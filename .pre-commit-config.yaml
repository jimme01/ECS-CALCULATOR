repos:
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format ECS-Calculator/ECS-Calculator.sln --verify-no-changes
        language: system
        pass_filenames: false
        always_run: true

      - id: commit-message
        name: Check commit message
        entry: powershell -ExecutionPolicy Bypass -File scripts/check-commit-message.ps1
        language: system
        stages: [commit-msg]
        
      - id: dotnet-build-check
        name: Build before push
        entry: powershell -ExecutionPolicy Bypass -File scripts/pre-push-build.ps1
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: prepare-commit-msg-append
        name: Append author and timestamp
        entry: powershell -ExecutionPolicy Bypass -File scripts/prepare-commit-msg.ps1
        language: system
        pass_filenames: true
        stages: [prepare-commit-msg]